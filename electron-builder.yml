appId: io.github.wjt0321.kimi-code-desktop
productName: Kimi Code Desktop
directories:
  output: release/${version}
files:
  - dist/**
  - package.json
extraResources:
  - from: build/kimi-code.ico
    to: kimi-code.ico
win:
  icon: build/kimi-code.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: ${productName}-${version}-setup.${ext}